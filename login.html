<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJO | Connexion Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; padding: 20px; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { color: #102A68; text-align: center; margin-bottom: 20px; }
        input { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background: #0756B8; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:active { background: #053f85; }
        .error { color: #D71920; text-align: center; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <form id="loginForm">
        <h2>Administration RJO</h2>
        <div id="errorMsg" class="error"></div>
        <input type="email" id="email" placeholder="Email administrateur" required>
        <input type="password" id="password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
    </form>

    <script>
        // CONFIGURATION : Remplacez par vos clés Supabase réelles
        const SUPABASE_URL = 'https://tvikvysdfbrcwmnnlgwp.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_xp-8aSpz3R7vRZ0aYp5hVw_7-UHoQXy';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = '';

            // 1. Connexion via l'authentification Supabase
            const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (authError) {
                errorDiv.textContent = 'Erreur : ' + authError.message;
                return;
            }

            // 2. Vérification du rôle dans la table profiles
            const userId = authData.user.id;
            const { data: profileData, error: profileError } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', userId)
                .single();

            if (profileError || !profileData || profileData.role !== 'super_admin') {
                errorDiv.textContent = 'Accès refusé : Droits super_admin requis.';
                await supabase.auth.signOut(); // Sécurité : déconnexion immédiate
                return;
            }

            // 3. Redirection vers le tableau de bord
            window.location.href = 'admin_dashboard.html';
        });
    </script>
</body>
</html>
