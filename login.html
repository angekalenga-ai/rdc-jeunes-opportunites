<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — RDC Jeunes Opportunités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body style="background:var(--gris-clair); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">

<div style="width:100%; max-width:400px;">
  <div style="text-align:center; margin-bottom:20px;">
    <img src="images/logo-rjo.png" alt="RJO" style="height:56px;">
  </div>

  <form class="carte-auth" id="form-login" onsubmit="return false;">
    <h2 style="text-align:center; font-size:1.2rem;">Administration RJO</h2>
    <div id="zone-message"></div>
    <div class="champ">
      <label>Email administrateur</label>
      <input type="email" id="login-email" required>
    </div>
    <div class="champ">
      <label>Mot de passe</label>
      <input type="password" id="login-motdepasse" required>
    </div>
    <button class="bouton bouton-primaire" style="width:100%;" onclick="gererLoginAdmin()">Se connecter</button>
  </form>

  <p style="text-align:center; margin-top:16px;"><a href="index.html" style="color:var(--gris-texte-clair); font-size:0.85rem;">← Retour au site</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  const ROLES_ADMIN = ["super_admin", "admin", "verificateur", "editeur"];

  function afficherMessage(texte, type) {
    document.getElementById("zone-message").innerHTML = `<div class="message-${type}">${texte}</div>`;
  }

  async function gererLoginAdmin() {
    const email = document.getElementById("login-email").value.trim();
    const motDePasse = document.getElementById("login-motdepasse").value;

    const { error } = await connecter(email, motDePasse);
    if (error) {
      afficherMessage(traduireErreurAuth(error.message), "erreur");
      return;
    }

    const session = await recupererSessionActuelle();
    const profil = await recupererProfil(session.user.id);

    if (!profil || !ROLES_ADMIN.includes(profil.role)) {
      afficherMessage("Accès refusé : droits administrateur requis.", "erreur");
      await deconnecter();
      return;
    }

    window.location.href = "admin_dashboard.html";
  }
</script>
</body>
</html>
