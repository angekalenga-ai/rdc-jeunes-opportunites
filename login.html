<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — RDC Jeunes Opportunités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body style="background:var(--gris-clair); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">

<div style="width:100%; max-width:400px;">
  <div style="text-align:center; margin-bottom:20px;">
    <img src="images/logo-rjo.png" alt="RJO" style="height:56px;">
  </div>

  <form class="carte-auth" id="form-login" onsubmit="gererLoginAdmin(event)">
    <h2 style="text-align:center; font-size:1.2rem;">Administration RJO</h2>
    <div id="zone-message"></div>
    <div class="champ">
      <label>Email administrateur</label>
      <input type="email" id="login-email" required>
    </div>
    <div class="champ">
      <label>Mot de passe</label>
      <input type="password" id="login-motdepasse" required>
    </div>
    <button type="submit" id="bouton-login" class="bouton bouton-primaire" style="width:100%;">Se connecter</button>
  </form>

  <p style="text-align:center; margin-top:16px;"><a href="index.html" style="color:var(--gris-texte-clair); font-size:0.85rem;">← Retour au site</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  const ROLES_ADMIN = ["super_admin", "admin", "verificateur", "editeur"];

  function afficherMessage(texte, type) {
    document.getElementById("zone-message").innerHTML = `<div class="message-${type}">${texte}</div>`;
  }

  async function gererLoginAdmin(event) {
  if (event) event.preventDefault();

  const bouton = document.getElementById("bouton-login");
  const email = document.getElementById("login-email").value.trim();
  const motDePasse = document.getElementById("login-motdepasse").value;

  const etape = (message) => {
    console.log("[LOGIN]", message);
    afficherMessage(message, "info");
  };

  if (!email || !motDePasse) {
    afficherMessage(
      "Veuillez renseigner votre email et votre mot de passe.",
      "erreur"
    );
    return;
  }

  bouton.disabled = true;
  bouton.textContent = "Connexion en cours...";

  try {
    etape("1/5 — Connexion à Supabase...");

    const resultat = await connecter(email, motDePasse);

    if (!resultat) {
      throw new Error("Aucune réponse du service d'authentification.");
    }

    if (resultat.error) {
      throw new Error(
        traduireErreurAuth(resultat.error.message || "Erreur Auth Supabase.")
      );
    }

    etape("2/5 — Authentification réussie.");

    const session = await recupererSessionActuelle();

    if (!session || !session.user) {
      throw new Error("Session Supabase introuvable après connexion.");
    }

    etape("3/5 — Session récupérée.");

    console.log("[LOGIN] User ID :", session.user.id);
    console.log("[LOGIN] Email :", session.user.email);

    const profil = await recupererProfil(session.user.id);

    if (!profil) {
      throw new Error(
        "Le profil utilisateur est introuvable ou inaccessible."
      );
    }

    etape("4/5 — Profil récupéré.");

    console.log("[LOGIN] Profil :", profil);
    console.log("[LOGIN] Rôle :", profil.role);

    const rolesAutorises = [
      "super_admin",
      "admin",
      "verificateur",
      "editeur"
    ];

    if (!rolesAutorises.includes(profil.role)) {
      await deconnecter();
      throw new Error(
        "Accès refusé. Rôle détecté : " + profil.role
      );
    }

    etape("5/5 — Rôle administrateur validé.");

    afficherMessage(
      "Connexion réussie. Ouverture du tableau de bord...",
      "succes"
    );

    setTimeout(() => {
      window.location.href = "admin_dashboard.html";
    }, 500);

  } catch (erreur) {
    console.error("[LOGIN] ERREUR :", erreur);

    afficherMessage(
      "Échec à l'étape actuelle : " +
      (erreur.message || "Erreur inconnue."),
      "erreur"
    );

  } finally {
    bouton.disabled = false;
    bouton.textContent = "Se connecter";
  }
}
</script>
</body>
</html>
