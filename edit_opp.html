<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier une opportunité — Back-Office RJO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="barre-admin">
  <div class="conteneur">
    <span class="titre-admin">RJO · Back-Office</span>
    <div>
      <a href="admin_list_opp.html">← Liste des opportunités</a>
    </div>
  </div>
</div>

<section class="section">
  <div class="conteneur">
    <div class="section-titre"><h2>Modifier l'opportunité</h2></div>
    <div id="zone-message"></div>

    <form class="carte-admin" id="form-edit" onsubmit="return false;">
      <div class="champ">
        <label>Titre</label>
        <input type="text" id="titre" required>
      </div>
      <div class="champ">
        <label>Catégorie</label>
        <select id="categorie">
          <option value="emploi">Emploi</option>
          <option value="stage">Stage</option>
          <option value="bourse">Bourse</option>
          <option value="formation">Formation</option>
          <option value="concours">Concours</option>
          <option value="entrepreneuriat">Entrepreneuriat</option>
          <option value="financement">Financement</option>
          <option value="programme_international">Programme international</option>
        </select>
      </div>
      <div class="champ">
        <label>Organisme</label>
        <input type="text" id="organisme" required>
      </div>
      <div class="champ">
        <label>Pays</label>
        <input type="text" id="pays">
      </div>
      <div class="champ">
        <label>Public cible</label>
        <input type="text" id="public_cible">
      </div>
      <div class="champ">
        <label>Date limite</label>
        <input type="date" id="date_limite">
      </div>
      <div class="champ">
        <label>Conditions</label>
        <textarea id="conditions" rows="3"></textarea>
      </div>
      <div class="champ">
        <label>Avantages</label>
        <textarea id="avantages" rows="3"></textarea>
      </div>
      <div class="champ">
        <label>Procédure officielle</label>
        <textarea id="procedure_officielle" rows="2"></textarea>
      </div>
      <div class="champ">
        <label>Lien officiel (source)</label>
        <input type="url" id="lien_officiel" required>
      </div>
      <div class="champ">
        <label>Statut de vérification</label>
        <select id="statut">
          <option value="a_verifier">À vérifier</option>
          <option value="en_verification">En vérification</option>
          <option value="verifiee">Vérifiée</option>
          <option value="expiree">Expirée</option>
        </select>
      </div>
      <div class="champ">
        <label>Notes internes</label>
        <textarea id="notes_internes" rows="2"></textarea>
      </div>

      <button class="bouton bouton-primaire" style="width:100%;" onclick="gererModificationOpportunite()">Enregistrer les modifications</button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  verifierAccesAdmin(["super_admin", "admin", "verificateur"]);

  const idOpportunite = new URLSearchParams(window.location.search).get("id");

  function afficherMessage(texte, type) {
    document.getElementById("zone-message").innerHTML = `<div class="message-${type}">${texte}</div>`;
  }

  async function chargerOpportunite() {
    if (!idOpportunite) {
      afficherMessage("Aucune opportunité spécifiée.", "erreur");
      return;
    }
    const { data, error } = await rjoClient
      .from("opportunites")
      .select("*, organismes(nom)")
      .eq("id", idOpportunite)
      .single();

    if (error || !data) {
      afficherMessage("Impossible de charger cette opportunité.", "erreur");
      return;
    }

    document.getElementById("titre").value = data.titre || "";
    document.getElementById("categorie").value = data.categorie || "emploi";
    document.getElementById("organisme").value = data.organismes?.nom || "";
    document.getElementById("pays").value = data.pays || "";
    document.getElementById("public_cible").value = data.public_cible || "";
    document.getElementById("date_limite").value = data.date_limite || "";
    document.getElementById("conditions").value = data.conditions || "";
    document.getElementById("avantages").value = data.avantages || "";
    document.getElementById("procedure_officielle").value = data.procedure_officielle || "";
    document.getElementById("lien_officiel").value = data.lien_officiel || "";
    document.getElementById("statut").value = data.statut || "a_verifier";
    document.getElementById("notes_internes").value = data.notes_internes || "";
  }

  async function gererModificationOpportunite() {
    try {
      const organismeId = await trouverOuCreerOrganisme(document.getElementById("organisme").value.trim());

      const { error } = await rjoClient
        .from("opportunites")
        .update({
          titre: document.getElementById("titre").value.trim(),
          categorie: document.getElementById("categorie").value,
          organisme_id: organismeId,
          pays: document.getElementById("pays").value.trim() || null,
          public_cible: document.getElementById("public_cible").value.trim() || null,
          date_limite: document.getElementById("date_limite").value || null,
          conditions: document.getElementById("conditions").value.trim() || null,
          avantages: document.getElementById("avantages").value.trim() || null,
          procedure_officielle: document.getElementById("procedure_officielle").value.trim() || null,
          lien_officiel: document.getElementById("lien_officiel").value.trim(),
          statut: document.getElementById("statut").value,
          notes_internes: document.getElementById("notes_internes").value.trim() || null,
        })
        .eq("id", idOpportunite);

      if (error) throw error;

      afficherMessage("Modifications enregistrées.", "succes");
      setTimeout(() => (window.location.href = "admin_list_opp.html"), 900);
    } catch (err) {
      afficherMessage("Erreur : " + err.message, "erreur");
    }
  }

  chargerOpportunite();
</script>
</body>
</html>
