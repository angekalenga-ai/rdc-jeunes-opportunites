<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités | RDC Jeunes Opportunités</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #1e293b; text-align: center; margin-bottom: 40px; }
        .article-card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .article-img { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
        .cat-tag { background: #dbeafe; color: #1e40af; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        h2 { color: #0f172a; margin: 15px 0; }
        p { color: #475569; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Actualités & Articles</h1>
        <div id="articles-list">Chargement des articles...</div>
    </div>

    <script>
        const supabase = supabase.createClient('https://tvikvysdfbrcwmnnlgwp.supabase.co', 'sb_publishable_xp-8aSpz3R7vRZ0aYp5hVw_7-UHoQXy');

        async function loadArticles() {
            const { data, error } = await supabase
                .from('articles')
                .select('*')
                .eq('statut', 'Publié') // N'affiche que ceux que tu as marqués comme publiés
                .order('created_at', { ascending: false });

            const list = document.getElementById('articles-list');
            if (error) { list.innerHTML = "Erreur de chargement."; return; }
            if (data.length === 0) { list.innerHTML = "Aucun article pour le moment."; return; }

            list.innerHTML = '';
            data.forEach(art => {
                const div = document.createElement('div');
                div.className = 'article-card';
                div.innerHTML = `
                    ${art.image_url ? `<img src="${art.image_url}" class="article-img">` : ''}
                    <span class="cat-tag">${art.categorie}</span>
                    <h2>${art.titre}</h2>
                    <p>${art.resume}</p>
                    <p style="font-size: 0.9rem; color: #64748b;"><em>${art.contenu.substring(0, 150)}...</em></p>
                `;
                list.appendChild(div);
            });
        }
        loadArticles();
    </script>
</body>
</html>
