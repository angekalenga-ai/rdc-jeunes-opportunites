<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gérer les articles — Back-Office RJO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<style>
  .actions-article {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .action-modifier,
  .action-supprimer {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .action-modifier {
    background: #dbeafe;
    color: #1d4ed8;
    border-color: #bfdbfe;
  }

  .action-modifier:hover {
    background: #bfdbfe;
  }

  .action-supprimer {
    background: #fee2e2;
    color: #b91c1c;
    border-color: #fecaca;
  }

  .action-supprimer:hover {
    background: #fecaca;
  }

  .titre-article {
    font-weight: 600;
    color: #1e293b;
  }

  .categorie-article {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: #f1f5f9;
    color: #475569;
    font-size: 12px;
    font-weight: 600;
  }

  .statut-article {
    padding: 7px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 7px;
    background: #f8fafc;
    color: #334155;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="barre-admin">
  <div class="conteneur">
    <span class="titre-admin">RJO · Back-Office</span>
    <div>
      <a href="admin_dashboard.html">← Tableau de bord</a>
    </div>
  </div>
</div>

<section class="section">
  <div class="conteneur">
    <div class="section-titre">
      <h2>Articles</h2>
      <a class="voir-tout" href="admin_add_article.html">+ Ajouter</a>
    </div>
    <div style="overflow-x:auto;">
      <table class="table-admin" id="table-articles">
        <thead>
          <tr>
            <th>Titre</th>
            <th>Catégorie</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="corps-articles"></tbody>
      </table>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  verifierAccesAdmin(["super_admin", "admin", "editeur"]);

  const STATUTS_ARTICLE = ["brouillon", "programme", "publie"];
  const LABELS_STATUT_ARTICLE = { brouillon: "Brouillon", programme: "Programmé", publie: "Publié" };
  const LABELS_CATEGORIE_ARTICLE = {
    etudes_bourses: "Études & Bourses", emploi_carriere: "Emploi & Carrière",
    cv_lettre_motivation: "CV & Lettre de motivation", entretiens: "Entretiens",
    numerique_technologie: "Numérique & Technologie", intelligence_artificielle: "Intelligence artificielle",
    entrepreneuriat: "Entrepreneuriat", financement: "Financement",
    opportunites_internationales: "Opportunités internationales", developpement_personnel: "Développement personnel",
    arnaques_verification: "Arnaques & Vérification", formations_certifications: "Formations & Certifications",
    jeunesse_rdc: "Jeunesse en RDC",
  };

  async function chargerArticles() {
    const { data, error } = await rjoClient
      .from("articles")
      .select("id, titre, categorie, statut")
      .order("created_at", { ascending: false });

    const corps = document.getElementById("corps-articles");

    if (error) {
      corps.innerHTML = `<tr><td colspan="4">Erreur : ${error.message}</td></tr>`;
      return;
    }
    if (!data || data.length === 0) {
      corps.innerHTML = '<tr><td colspan="4" style="text-align:center;">Aucun article pour le moment.</td></tr>';
      return;
    }

    corps.innerHTML = "";
    data.forEach((art) => {
      const optionsStatut = STATUTS_ARTICLE.map(
        (s) => `<option value="${s}" ${s === art.statut ? "selected" : ""}>${LABELS_STATUT_ARTICLE[s]}</option>`
      ).join("");

      const tr = document.createElement("tr");

           tr.innerHTML = `
        <td>
          <span class="titre-article">
            ${art.titre}
          </span>
        </td>

        <td>
          <span class="categorie-article">
            ${LABELS_CATEGORIE_ARTICLE[art.categorie] || art.categorie}
          </span>
        </td>

        <td>
          <select
            class="statut-article"
            data-id="${art.id}"
            onchange="changerStatutArticle(this)"
          >
            ${optionsStatut}
          </select>
        </td>

        <td>
          <div class="actions-article">

            <a
              class="action-modifier"
              href="admin_edit_article.html?id=${encodeURIComponent(art.id)}"
            >
              Modifier
            </a>

            <button
              type="button"
              class="action-supprimer"
              onclick="supprimerArticle('${art.id}')"
            >
              Supprimer
            </button>

          </div>
        </td>
      `;

      corps.appendChild(tr);
    });
  }

  async function changerStatutArticle(selectEl) {
    const id = selectEl.dataset.id;
    const nouveauStatut = selectEl.value;
    const maj = { statut: nouveauStatut };
    if (nouveauStatut === "publie") maj.date_publication = new Date().toISOString();
    const { error } = await rjoClient.from("articles").update(maj).eq("id", id);
    if (error) alert("Erreur : " + error.message);
  }

  async function supprimerArticle(id) {
    if (!confirm("Confirmer la suppression de cet article ?")) return;
    const { error } = await rjoClient.from("articles").delete().eq("id", id);
    if (error) {
      alert("Erreur : " + error.message);
    } else {
      chargerArticles();
    }
  }

  chargerArticles();
</script>
</body>
</html>
