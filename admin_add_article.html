<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajouter un article — Back-Office RJO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="barre-admin">
  <div class="conteneur">
    <span class="titre-admin">RJO · Back-Office</span>
    <div>
      <a href="admin_dashboard.html">← Tableau de bord</a>
    </div>
  </div>
</div>

<section class="section">
  <div class="conteneur">
    <div class="section-titre"><h2>Publier un article</h2></div>
    <div id="zone-message"></div>

    <form class="carte-admin" id="form-article" onsubmit="return false;">
      <div class="champ">
        <label>Titre</label>
        <input type="text" id="titre" required>
      </div>
      <div class="champ">
        <label>Catégorie</label>
        <select id="categorie" required>
          <option value="etudes_bourses">Études & Bourses</option>
          <option value="emploi_carriere">Emploi & Carrière</option>
          <option value="cv_lettre_motivation">CV & Lettre de motivation</option>
          <option value="entretiens">Entretiens</option>
          <option value="numerique_technologie">Numérique & Technologie</option>
          <option value="intelligence_artificielle">Intelligence artificielle</option>
          <option value="entrepreneuriat">Entrepreneuriat</option>
          <option value="financement">Financement</option>
          <option value="opportunites_internationales">Opportunités internationales</option>
          <option value="developpement_personnel">Développement personnel</option>
          <option value="arnaques_verification">Arnaques & Vérification</option>
          <option value="formations_certifications">Formations & Certifications</option>
          <option value="jeunesse_rdc">Jeunesse en RDC</option>
        </select>
      </div>
      <div class="champ">
        <label>Résumé court (accroche)</label>
        <input type="text" id="resume">
      </div>
      <div class="champ">
        <label>Contenu complet</label>
        <textarea id="contenu" rows="8" required></textarea>
      </div>
      <div class="champ">
  <label>Image de l’article</label>
  <input
    type="file"
    id="image"
    accept="image/jpeg,image/png,image/webp"
    required
  >
  <small>JPG, PNG ou WebP · 5 Mo maximum</small>
  <div id="apercu-image" style="margin-top:10px;"></div>
</div>
      <div class="champ">
        <label>Statut</label>
        <select id="statut">
          <option value="brouillon">Brouillon</option>
          <option value="publie">Publié</option>
        </select>
      </div>

      <button class="bouton bouton-primaire" style="width:100%;" onclick="gererAjoutArticle()">Enregistrer l'article</button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  verifierAccesAdmin(["super_admin", "admin", "editeur"]);

  function afficherMessage(texte, type) {
    document.getElementById("zone-message").innerHTML =
      `<div class="message-${type}">${texte}</div>`;
  }

  function afficherApercuImage() {
    const input = document.getElementById("image");
    const apercu = document.getElementById("apercu-image");

    apercu.innerHTML = "";

    if (!input.files || !input.files[0]) return;

    const fichier = input.files[0];

    if (!["image/jpeg", "image/png", "image/webp"].includes(fichier.type)) {
      afficherMessage(
        "Format d’image non autorisé. Utilisez JPG, PNG ou WebP.",
        "erreur"
      );
      input.value = "";
      return;
    }

    if (fichier.size > 5 * 1024 * 1024) {
      afficherMessage(
        "L’image ne doit pas dépasser 5 Mo.",
        "erreur"
      );
      input.value = "";
      return;
    }

    const image = document.createElement("img");
    image.src = URL.createObjectURL(fichier);
    image.alt = "Aperçu de l’image";
    image.style.maxWidth = "300px";
    image.style.maxHeight = "200px";
    image.style.borderRadius = "8px";

    apercu.appendChild(image);
  }

  document.getElementById("image").addEventListener(
    "change",
    afficherApercuImage
  );

  async function gererAjoutArticle() {
    const titre = document.getElementById("titre").value.trim();
    const contenu = document.getElementById("contenu").value.trim();
    const fichier = document.getElementById("image").files[0];

    if (!titre || !contenu) {
      afficherMessage(
        "Titre et contenu sont obligatoires.",
        "erreur"
      );
      return;
    }

    if (!fichier) {
      afficherMessage(
        "Veuillez sélectionner une image.",
        "erreur"
      );
      return;
    }

    if (!["image/jpeg", "image/png", "image/webp"].includes(fichier.type)) {
      afficherMessage(
        "Format d’image non autorisé. Utilisez JPG, PNG ou WebP.",
        "erreur"
      );
      return;
    }

    if (fichier.size > 5 * 1024 * 1024) {
      afficherMessage(
        "L’image ne doit pas dépasser 5 Mo.",
        "erreur"
      );
      return;
    }

    const bouton = document.querySelector("#form-article button");

    bouton.disabled = true;
    bouton.textContent = "Enregistrement en cours...";

    let cheminImage = null;

    try {
      const extension = fichier.name.split(".").pop().toLowerCase();

      const nomFichier =
        `${Date.now()}-${crypto.randomUUID()}.${extension}`;

      cheminImage = `images/${nomFichier}`;

      afficherMessage(
        "Téléversement de l’image en cours...",
        "succes"
      );

      const { error: uploadError } = await rjoClient.storage
        .from("articles")
        .upload(cheminImage, fichier, {
          cacheControl: "3600",
          contentType: fichier.type,
          upsert: false
        });

      if (uploadError) {
        throw uploadError;
      }

      const { data: urlData } = rjoClient.storage
        .from("articles")
        .getPublicUrl(cheminImage);

      const imageUrl = urlData.publicUrl;

      const statut = document.getElementById("statut").value;

      const { error: articleError } = await rjoClient
        .from("articles")
        .insert({
          titre,
          categorie: document.getElementById("categorie").value,
          resume:
            document.getElementById("resume").value.trim() || null,
          contenu,
          image_url: imageUrl,
          statut,
          date_publication:
            statut === "publie"
              ? new Date().toISOString()
              : null
        });

      if (articleError) {
        await rjoClient.storage
          .from("articles")
          .remove([cheminImage]);

        throw articleError;
      }

      afficherMessage(
        "Article et image enregistrés avec succès.",
        "succes"
      );

      document.getElementById("form-article").reset();
      document.getElementById("apercu-image").innerHTML = "";

    } catch (error) {
      console.error("Erreur ajout article :", error);

      afficherMessage(
        "Erreur : " + (error.message || "Une erreur est survenue."),
        "erreur"
      );

    } finally {
      bouton.disabled = false;
      bouton.textContent = "Enregistrer l'article";
    }
  }
</script>
</body>
</html>
