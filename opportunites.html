<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDC Jeunes Opportunités - Opportunités en cours</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container">

            <a href="index.html" class="brand">
                <img src="images/logo-rjo.png" alt="Logo RJO">
                <span>RDC Jeunes Opportunités</span>
            </a>

            <button
                class="nav-toggle"
                aria-label="Ouvrir le menu"
                aria-expanded="false">
                ☰
            </button>

            <nav class="main-nav">
                <a href="index.html">Accueil</a>
                <a href="opportunites.html" class="active">Opportunités</a>
                <a href="articles.html">Articles</a>
                <a href="apropos.html">À propos</a>
                <a href="contact.html">Contact</a>
            </nav>

        </div>
    </header>


    <!-- Contenu -->
    <main class="container block">

        <div class="section-head">
            <h1>Opportunités en cours</h1>
            <a href="index.html" class="see-all">← Accueil</a>
        </div>

        <div id="liste-opportunites">
            <div style="text-align:center; color:#6b7280; padding:30px;">
                Chargement des opportunités...
            </div>
        </div>

    </main>


    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">

            <div class="footer-row">

                <div>
                    <strong>RDC Jeunes Opportunités</strong>

                    <p style="font-size:0.85rem; opacity:0.8; margin-top:5px;">
                        L'emploi, les formations et les bourses pour la jeunesse congolaise.
                    </p>
                </div>

                <div class="footer-links">
                    <a href="apropos.html">À propos</a>
                    <a href="contact.html">Contact</a>
                    <a href="articles.html">Articles</a>
                </div>

            </div>

        </div>
    </footer>


    <!-- Chargement des opportunités -->
    <script>
        window.addEventListener('DOMContentLoaded', async () => {

            const container =
                document.getElementById('liste-opportunites');

            const params =
                new URLSearchParams(window.location.search);

            const recherche =
                params.get('q') || '';

            const categorie =
                params.get('cat') || '';

            try {

                const opportunites =
                    await recupererOpportunitesVerifiees({
                        recherche,
                        categorie
                    });

                if (!opportunites.length) {

                    container.innerHTML = `
                        <p style="
                            text-align:center;
                            color:#6b7280;
                            padding:30px;
                        ">
                            Aucune opportunité vérifiée disponible
                            pour le moment.
                        </p>
                    `;

                    return;
                }

                container.innerHTML =
                    opportunites
                        .map(carteOpportuniteHTML)
                        .join('');

            } catch (err) {

                console.error(
                    'Erreur chargement opportunités :',
                    err
                );

                container.innerHTML = `
                    <div style="
                        background:#fee2e2;
                        color:#dc2626;
                        padding:15px;
                        border-radius:8px;
                    ">
                        Impossible de charger les opportunités
                        pour le moment.
                    </div>
                `;
            }

        });
    </script>


    <!-- JavaScript général -->
    <script src="app.js"></script>

</body>
</html>
