<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDC Jeunes Opportunités - Opportunités en cours</title>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px;">

    <div style="max-width: 800px; margin: 0 auto;">
        <h1 style="color: #1e3a8a; font-size: 24px; margin-bottom: 20px;">Opportunités en cours</h1>

        <!-- Conteneur des données -->
        <div id="liste-opportunites">
            <div style="text-align: center; color: #6b7280; padding: 30px;">Chargement des opportunités...</div>
        </div>
    </div>

    <script>
        // Attendre que la page et le SDK soient prêts
        window.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('liste-opportunites');
            
            try {
                // Vérifier si le SDK Supabase s'est bien chargé
                if (typeof window.supabase === 'undefined') {
                    throw new Error("Le script Supabase n'a pas pu se charger depuis Internet.");
                }

                // ⚠️ METS TES VRAIES CLÉS ICI ⚠️
                const SUPABASE_URL = 'https://tvikvysdfbrcwmnnlgwp.supabase.co';
                const SUPABASE_ANON_KEY = 'sb_publishable_xp-8aSpz3R7vRZ0aYp5hVw_7-UHoQXy';
                
                const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // Récupération des données
                const { data, error } = await client
                    .from('opportunites')
                    .select('*');

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#6b7280; padding:20px;">Aucune opportunité disponible pour le moment.</p>';
                    return;
                }

                container.innerHTML = '';
                
                data.forEach(opp => {
                    const card = document.createElement('div');
                    card.style.cssText = "background: #ffffff; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 4px solid #2563eb;";
                    card.innerHTML = `
                        <span style="display:inline-block; background:#eff6ff; color:#1d4ed8; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; margin-bottom:10px; text-transform:uppercase;">${opp.categorie || 'Stage'}</span>
                        <h3 style="margin: 0 0 10px 0; font-size: 18px; color: #111827;">${opp.titre}</h3>
                        <p style="margin: 0 0 15px 0; color: #4b5563; font-size: 14px; line-height: 1.5;">${opp.public_cible || 'Tous publics'}</p>
                        <a href="${opp.lien}" target="_blank" style="display:inline-block; background:#2563eb; color:white; padding:8px 16px; border-radius:6px; text-decoration:none; font-size:14px; font-weight:500;">Voir l'opportunité</a>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                // Affiche l'erreur en rouge vif sur le site si quelque chose bloque
                container.innerHTML = `<div style="background: #fee2e2; color: #dc2626; padding: 15px; border-radius: 8px; font-size: 14px;"><strong>Erreur :</strong> ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
