<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunités | RDC Jeunes Opportunités</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .grid-opp { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .carte-opp { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #0756B8; }
        .carte-opp h3 { color: #102A68; margin-top: 0; }
        .badge { display: inline-block; background: #e0e7ff; color: #0756B8; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<header class="entete">
    <!-- Votre header existant -->
</header>

<section class="section">
    <div class="conteneur">
        <h2>Opportunités en cours</h2>
        <div id="liste-opportunites" class="grid-opp">
            <p>Chargement des opportunités...</p>
        </div>
    </div>
</section>

<!-- Scripts Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>

<script>
    async function chargerOpportunites() {
        const container = document.getElementById('liste-opportunites');
        
        // Récupération des données depuis Supabase
        const { data, error } = await supabase
            .from('opportunites')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = `<p>Erreur lors du chargement : ${error.message}</p>`;
            return;
        }

        if (data.length === 0) {
            container.innerHTML = "<p>Aucune opportunité pour le moment.</p>";
            return;
        }

        container.innerHTML = ""; // Vider le texte "Chargement..."
        
        // Affichage dynamique
        data.forEach(opp => {
            const carte = document.createElement('div');
            carte.className = 'carte-opp';
            carte.innerHTML = `
                <span class="badge">${opp.categorie || 'Autre'}</span>
                <h3>${opp.titre}</h3>
                <p>${opp.description}</p>
                <a href="${opp.lien}" target="_blank" class="bouton">Postuler</a>
            `;
            container.appendChild(carte);
        });
    }

    chargerOpportunites();
</script>

</body>
</html>
